name: Update school calendar

on:
  schedule:
    - cron: "0 5 * * 1"   # every Monday, 5am UK time (winter)
  workflow_dispatch:       # adds a "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build calendar
        run: python build_calendar.py
      - name: Save if changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add school.ics
          git diff --cached --quiet || git commit -m "Update school calendar"
          git push
